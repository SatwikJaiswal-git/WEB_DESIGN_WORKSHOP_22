<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
 <div class="container">
   <h1>Student Registration Form</h1>
   <form id="Student Registration Form">
    <label>Name</label>
    <input type="text" id="name" placeholder="Enter your full name"><br><br>
    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email"><br><br>
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password"><br><br>
    <label>Age</label>
    <input type="number" id="age" placeholder="Enter Your Age"><br><br>
    <label>Date of birth</label>
    <input typr="date" id="dob" placeholder="Enter your date of Birth"><br><br>
    <label>Gender</label>
    <div class="radio-group">
     <input type="radio" name="gender" value="Male"> Male 
     <input type="radio" name="gender" value="Female"> Female 
     <input type="radio" name="gender" value="Other"> Other 
    </div>
    <label>Course</label> 
     <select id="course"> 
      <option value="">Select Course</option> 
      <option value="B.Tech">B.Tech</option> 
      <option value="BCA">BCA</option> 
      <option value="BBA">BBA</option> 
      <option value="MCA">MCA</option> 
    </select><br><br>
    <label>Phone Number</label> 
    <input type="tel" id="phone" placeholder="Enter phone number"><br><br>
    <label>Upload Photo</label> 
    <input type="file" id="photo" accept="image/*"><br><br>
    <div class="checkbox"> 
      <input type="checkbox" id="terms">
      <label for="terms">I agree to the terms and conditions</label>
    </div>
    <button type="submit">Submit</button>
  </form>
  <p id="message"></p>
</div>
</body>
</html>
