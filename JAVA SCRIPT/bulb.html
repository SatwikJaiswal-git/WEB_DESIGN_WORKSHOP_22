<!DOCTYPE html>
<html>
<head>
    <title>Bulb ON/OFF</title>
</head>
<body>

    <img id="bulb" src="bright-light-bulb-svgrepo-com.svg" width="200">

    <button onclick="turnOn()">ON</button>
    <button onclick="turnOff()">OFF</button>

    <script>
        function turnOn() {
            document.getElementById("bulb").src = "Light_Bulb_or_Idea_Flat_Icon_Vector.svg";
        }

        function turnOff() {
            document.getElementById("bulb").src = "bright-light-bulb-svgrepo-com.svg";
        }
    </script>

</body>
</html>
